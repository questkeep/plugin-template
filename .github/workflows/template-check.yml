name: Template check

# Keeps the template from rotting: for each combination of plugin kinds, runs `npm run init` in a
# copy of the repository and then the generated plugin's own checks (tests, manifest check, pack,
# and for stores rustfmt, clippy, cargo test and the wasm build). This workflow is deleted by
# `npm run init`, it only belongs to the template.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: template-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  generated:
    name: init ${{ matrix.kinds }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kinds:
          - store
          - extension
          - theme
          - store,extension
          - store,theme
          - extension,theme
          - store,extension,theme
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Template's own script tests (including init)
        run: node --test scripts/release/*.test.mjs scripts/*.test.mjs

      - uses: dtolnay/rust-toolchain@stable
        if: contains(matrix.kinds, 'store')
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        if: contains(matrix.kinds, 'store')
        with:
          shared-key: template-check
          workspaces: ${{ runner.temp }}/demo -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The copy is a repository of its own, like a project created from the template.
      - name: Create the plugin from the template
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/demo"
          cd "$RUNNER_TEMP/demo"
          git init -q -b main
          node scripts/init.mjs demo-plugin "Demo Plugin" --kinds "${{ matrix.kinds }}" \
            --author "Template Check" --description "Generated by the template check." \
            --repo questkeep/demo-plugin --yes
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "chore: init"
          echo "--- files"
          git ls-files

      - name: The template's leftovers are gone
        working-directory: ${{ runner.temp }}/demo
        run: |
          test ! -e scripts/init.mjs
          test ! -e .github/workflows/template-check.yml
          ! grep -rIl --exclude-dir=.git --exclude-dir=target -e 'my-plugin' -e 'OWNER/' . || { echo "placeholders left"; exit 1; }

      - name: rustfmt, clippy and tests
        if: contains(matrix.kinds, 'store')
        working-directory: ${{ runner.temp }}/demo
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build provider.wasm
        if: contains(matrix.kinds, 'store')
        working-directory: ${{ runner.temp }}/demo
        run: sh ./build.sh

      - name: Script tests
        working-directory: ${{ runner.temp }}/demo
        run: npm test

      - name: Extension syntax check
        if: contains(matrix.kinds, 'extension')
        working-directory: ${{ runner.temp }}/demo
        run: node --check main.js

      - name: Pack (checks plugin.json against the host's rules)
        working-directory: ${{ runner.temp }}/demo
        run: |
          node scripts/pack.mjs
          unzip -l dist/demo-plugin-0.1.0.zip

      - name: Changeset tooling
        working-directory: ${{ runner.temp }}/demo
        run: npm run changeset -- status
